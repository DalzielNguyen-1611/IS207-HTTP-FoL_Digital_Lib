<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 180" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="uitTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g transform="translate(10, 0)">
    <!-- UIT LOGO EMBLEM -->
    <g transform="translate(100, 90)" filter="url(#dropShadow)">
      <!-- Outer Glow circle -->
      <circle cx="0" cy="0" r="46" fill="url(#globeGrad)" opacity="0.4" />
      
      <!-- Globe core -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.9"/>
      <ellipse cx="0" cy="0" rx="42" ry="16" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.6"/>
      <ellipse cx="0" cy="0" rx="18" ry="42" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.6"/>
      <line x1="-42" y1="0" x2="42" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
      <line x1="0" y1="-42" x2="0" y2="42" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>

      <!-- Orbit 1 (tilted left) -->
      <ellipse cx="0" cy="0" rx="68" ry="24" fill="none" stroke="url(#orbitGrad)" stroke-width="3.5" transform="rotate(-32)" filter="url(#softGlow)"/>
      <circle cx="-54" cy="-28" r="4.5" fill="#bae6fd" filter="url(#softGlow)"/>

      <!-- Orbit 2 (tilted right) -->
      <ellipse cx="0" cy="0" rx="68" ry="24" fill="none" stroke="url(#orbitGrad)" stroke-width="3.5" transform="rotate(32)" filter="url(#softGlow)"/>
      <circle cx="54" cy="-28" r="4.5" fill="#60a5fa" filter="url(#softGlow)"/>

      <!-- Central stylized open book / flame crest -->
      <path d="M -16 6 Q -8 -6 0 10 Q 8 -6 16 6 Q 0 18 -16 6 Z" fill="#60a5fa" opacity="0.9"/>
      <path d="M 0 -16 L 0 10" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- TEXT SECTION -->
    <!-- Line 1: ĐẠI HỌC QUỐC GIA THÀNH PHỐ HỒ CHÍ MINH -->
    <text x="210" y="52" 
          font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" 
          font-size="16" 
          font-weight="600" 
          letter-spacing="1.2" 
          fill="url(#headerGrad)" 
          opacity="0.9">
      ĐẠI HỌC QUỐC GIA THÀNH PHỐ HỒ CHÍ MINH
    </text>

    <!-- Line 2: TRƯỜNG ĐẠI HỌC CÔNG NGHỆ THÔNG TIN -->
    <text x="210" y="82" 
          font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" 
          font-size="20" 
          font-weight="700" 
          letter-spacing="1.5" 
          fill="#f1f5f9"
          filter="url(#dropShadow)">
      TRƯỜNG ĐẠI HỌC CÔNG NGHỆ THÔNG TIN
    </text>

    <!-- Line 3: VNUHCM - UIT (Large Embossed Blue) -->
    <text x="208" y="146" 
          font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Impact, Roboto, sans-serif" 
          font-size="56" 
          font-weight="900" 
          letter-spacing="3" 
          fill="url(#uitTextGrad)"
          stroke="#1e40af"
          stroke-width="1.5"
          filter="url(#dropShadow)">
      VNUHCM - UIT
    </text>
  </g>
</svg>
